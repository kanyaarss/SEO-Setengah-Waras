version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: backlynx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  go-orchestrator:
    build: 
      context: ./go
      dockerfile: Dockerfile
    container_name: backlynx-go
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://host.docker.internal:6379
      - GO_PORT=8080
      - GO_WORKER_COUNT=10
    volumes:
      - ./web:/app/web
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis_data:
