services:
  redis:
    image: redis:7-alpine
    container_name: backlynx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  go-orchestrator:
    build: 
      context: ./go
      dockerfile: Dockerfile
    container_name: backlynx-go
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379
      - GO_PORT=8080
      - GO_WORKER_COUNT=100
    volumes:
      - ./web:/app/web
    depends_on:
      - redis

  nodejs-workers:
    build:
      context: ./nodejs
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_PORT=3000
      - NODE_HEADLESS=true
      - GO_HOST=go-orchestrator
      - GO_PORT=8080
    depends_on:
      - redis
      - go-orchestrator
    deploy:
      replicas: 2

volumes:
  redis_data:
